<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>群事项 · 物流工单控制台</title>
<style>
:root{
  --ink:#1d2a33; --ink2:#2b3b46; --bg:#eceef0; --surface:#fff;
  --line:#dde2e6; --lineSoft:#edf0f2;
  --text:#24323b; --text2:#5c6b74; --text3:#8b979e;
  --amber:#c2821b; --amber2:#e0a63c; --amberSoft:#faf1de;
  --pending:#3f74a8; --due:#cf8a19; --overdue:#c0392b; --verify:#7a5aa4; --done:#4f8a63;
  --shadow:0 8px 30px rgba(29,42,51,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"SF Mono",Consolas,"Roboto Mono",monospace}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

/* ============ 顶部栏 ============ */
.topbar{
  height:60px; background:var(--ink); color:#fff; display:flex; align-items:center;
  padding:0 22px; gap:20px; position:sticky; top:0; z-index:50;
  border-bottom:3px solid var(--amber);
}
.brand{display:flex;align-items:center;gap:11px;min-width:300px}
.brand-mark{
  width:34px;height:34px;background:var(--amber);border-radius:6px;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#1d2a33;
  letter-spacing:-1px;
}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:11px;color:#9fb0ba;margin-top:1px}
.top-search{flex:1;max-width:420px;position:relative}
.top-search input{
  width:100%;height:36px;border:1px solid #3d4d58;background:#26343e;border-radius:6px;
  color:#fff;padding:0 14px 0 36px;outline:none;
}
.top-search input:focus{border-color:var(--amber2);background:#2b3a45}
.top-search input::placeholder{color:#85949e}
.top-search svg{position:absolute;left:11px;top:10px;opacity:.6}
.top-actions{display:flex;align-items:center;gap:12px;margin-left:auto}
.remind{
  display:flex;align-items:center;gap:6px;font-size:12px;color:#cbd6dd;
  padding:6px 10px;border:1px solid #3d4d58;border-radius:20px;
}
.remind b{background:var(--overdue);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px}
.btn-primary{
  height:36px;background:var(--amber);color:#1d2a33;border:none;border-radius:6px;
  padding:0 16px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;
}
.btn-primary:hover{background:var(--amber2)}

/* ============ 队列看板 ============ */
.queues{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px 22px 4px}
.queue{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px 13px;position:relative;cursor:pointer;overflow:hidden;
  transition:transform .12s,border-color .12s,box-shadow .12s;
}
.queue:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(29,42,51,.08)}
.queue.active{border-color:var(--qc);box-shadow:0 0 0 2px var(--qc) inset}
.queue::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--qc)}
.q-top{display:flex;align-items:center;justify-content:space-between}
.q-name{font-size:13px;color:var(--text2);font-weight:600}
.q-icon{width:26px;height:26px;border-radius:6px;background:var(--qbg);color:var(--qc);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.q-num{font-size:30px;font-weight:800;color:var(--qc);line-height:1.15;margin-top:6px}
.q-num small{font-size:12px;font-weight:500;color:var(--text3);margin-left:5px}
.q-foot{font-size:11px;color:var(--text3);margin-top:2px}

/* ============ 工具栏 ============ */
.toolbar{
  margin:12px 22px 0;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:11px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.viewtabs{display:flex;background:var(--bg);border-radius:6px;padding:3px;gap:2px}
.viewtabs button{
  border:none;background:transparent;padding:6px 14px;border-radius:4px;font-size:13px;
  color:var(--text2);font-weight:600;
}
.viewtabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.filter-sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters label{font-size:12px;color:var(--text3)}
.filters select{
  height:32px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--text);
  padding:0 26px 0 9px;font-size:12px;outline:none;max-width:140px;
}
.filters select:focus{border-color:var(--amber2)}
.btn-clear{border:1px solid var(--line);background:#fff;color:var(--text2);height:32px;
  padding:0 12px;border-radius:5px;font-size:12px}
.btn-clear:hover{border-color:var(--overdue);color:var(--overdue)}
.result-count{margin-left:auto;font-size:12px;color:var(--text3)}
.result-count b{color:var(--text);font-size:14px}

/* ============ 工单列表 ============ */
.content{padding:14px 22px 40px}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto}
table.tickets{width:100%;border-collapse:collapse;min-width:1050px}
table.tickets th{
  text-align:left;font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.5px;
  padding:11px 12px;background:#f7f8f9;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tickets td{padding:11px 12px;border-bottom:1px solid var(--lineSoft);font-size:13px;vertical-align:middle}
table.tickets tr:last-child td{border-bottom:none}
table.tickets tbody tr{cursor:pointer;transition:background .1s}
table.tickets tbody tr:hover{background:#fbf8f1}
.tid{font-size:12px;color:var(--pending);font-weight:700;letter-spacing:.3px}
.ttitle{font-weight:600;color:var(--ink);max-width:280px;line-height:1.35}
.ttitle .flags{display:inline-flex;gap:4px;margin-top:4px}
.st{padding:3px 9px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pending{background:#eaf2fa;color:var(--pending)}
.st-due{background:#fbf1dd;color:#a86c0d}
.st-overdue{background:#fbe9e7;color:var(--overdue)}
.st-verify{background:#f2ecf9;color:var(--verify)}
.st-done{background:#e9f3ec;color:var(--done)}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:3px;background:#eef1f3;color:var(--text2);white-space:nowrap}
.chip.plate{background:#eef0f2;color:#39454d;font-family:"SF Mono",Consolas,monospace;letter-spacing:.3px}
.chip.verify{background:#f2ecf9;color:var(--verify)}
.chip.cross{background:#fdf0e3;color:#a9701a}
.chip.conflict{background:#fbe9e7;color:var(--overdue)}
.chip.evi{background:#eaf2fa;color:var(--pending)}
.due-txt{font-size:12px;white-space:nowrap}
.due-txt.od{color:var(--overdue);font-weight:700}
.due-txt.soon{color:#a86c0d;font-weight:700}
.ver-badge{font-size:11px;color:var(--text3);font-family:"SF Mono",Consolas,monospace}
.empty{padding:60px 20px;text-align:center;color:var(--text3)}
.empty b{display:block;color:var(--text2);font-size:15px;margin-bottom:6px}

/* ============ 跨群汇总 ============ */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.sum-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sum-head{padding:13px 16px;border-bottom:1px solid var(--lineSoft);display:flex;align-items:center;justify-content:space-between}
.sum-head .g{font-weight:700;color:var(--ink)}
.sum-head .c{font-size:12px;color:var(--text3)}
.sum-body{padding:13px 16px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.bar-row span:first-child{width:56px;color:var(--text2)}
.bar-track{flex:1;height:9px;background:var(--bg);border-radius:5px;overflow:hidden;display:flex}
.bar-seg{height:100%}
.bar-row b{width:20px;text-align:right;color:var(--text)}
.sum-foot{padding:10px 16px;background:#fafbfb;border-top:1px solid var(--lineSoft);font-size:12px;color:var(--text2)}
.sum-foot b{color:var(--amber)}

/* ============ 详情抽屉 ============ */
.overlay{position:fixed;inset:0;background:rgba(29,42,51,.42);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:600px;max-width:94vw;background:var(--surface);
  z-index:90;box-shadow:-12px 0 40px rgba(0,0,0,.15);transform:translateX(105%);
  transition:transform .25s cubic-bezier(.2,.7,.3,1);display:flex;flex-direction:column;
}
.drawer.show{transform:translateX(0)}
.dr-head{padding:18px 22px 15px;border-bottom:1px solid var(--line);background:var(--ink);color:#fff;flex-shrink:0}
.dr-head .tid{color:var(--amber2)}
.dr-head h2{font-size:18px;margin:6px 0 8px;line-height:1.35}
.dr-head .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dr-head .st{font-size:11px}
.dr-close{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.12);border:none;color:#fff;
  width:30px;height:30px;border-radius:5px;font-size:18px;line-height:1}
.dr-close:hover{background:rgba(255,255,255,.22)}
.dr-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 14px;gap:2px;flex-shrink:0;background:#fafbfb}
.dr-tabs button{border:none;background:transparent;padding:12px 13px;font-size:13px;color:var(--text2);
  font-weight:600;border-bottom:2px solid transparent}
.dr-tabs button.active{color:var(--amber);border-bottom-color:var(--amber)}
.dr-body{flex:1;overflow-y:auto;padding:18px 22px 40px}
.tabpane{display:none}
.tabpane.active{display:block}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--lineSoft);border:1px solid var(--lineSoft);border-radius:6px;overflow:hidden}
.info-cell{background:#fff;padding:11px 13px}
.info-cell .k{font-size:11px;color:var(--text3);margin-bottom:3px}
.info-cell .v{font-size:13px;color:var(--text);font-weight:600;word-break:break-all}
.sec{margin-top:20px}
.sec-t{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.5px;margin-bottom:9px;
  display:flex;align-items:center;gap:7px}
.sec-t::before{content:"";width:3px;height:13px;background:var(--amber);border-radius:2px}
.notice{background:var(--amberSoft);border:1px solid #ecd9a8;border-radius:6px;padding:10px 12px;
  font-size:12px;color:#8a6412;line-height:1.55}
.notice.verify{background:#f5f0fb;border-color:#ddd0ee;color:#6c4f95}
.notice.conflict{background:#fceceb;border-color:#f0cfcb;color:#a83226}
.raw-msg{border:1px solid var(--line);border-left:3px solid var(--pending);border-radius:5px;
  padding:9px 12px;margin-bottom:8px;background:#fcfdfd}
.raw-msg .m-h{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--text3);margin-bottom:4px}
.raw-msg .m-h b{color:var(--text);font-size:12px}
.raw-msg .m-c{font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word}
.evi-item{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:5px;
  padding:8px 11px;margin-bottom:7px;font-size:12px}
.evi-item .ecode{background:#eaf2fa;color:var(--pending);font-weight:700;padding:2px 7px;border-radius:3px;
  font-family:"SF Mono",Consolas,monospace}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;
  background:#fff;border:2px solid var(--tc,var(--amber))}
.tl-time{font-size:11px;color:var(--text3);font-family:"SF Mono",Consolas,monospace}
.tl-content{font-size:13px;color:var(--text);margin-top:2px}
.tl-type{font-size:10px;color:var(--tc,var(--text2));font-weight:700;margin-left:6px}
.follow-box{display:flex;gap:7px;margin-top:10px}
.follow-box input{height:34px;border:1px solid var(--line);border-radius:5px;padding:0 10px;flex:1;outline:none}
.follow-box input:focus{border-color:var(--amber2)}
.follow-box button{height:34px;background:var(--ink);color:#fff;border:none;border-radius:5px;padding:0 14px;font-size:12px;font-weight:600}
.ver-item{border:1px solid var(--line);border-radius:6px;margin-bottom:9px;overflow:hidden}
.ver-head{padding:9px 12px;background:#f8f9fa;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:12px}
.ver-head:hover{background:#f2f4f5}
.ver-head b{color:var(--verify);font-family:"SF Mono",Consolas,monospace}
.ver-detail{padding:10px 12px;font-size:12px;color:var(--text2);display:none;border-top:1px solid var(--lineSoft)}
.ver-detail.open{display:block}
.ver-detail .kv{margin-bottom:4px}
.ver-detail .kv b{color:var(--text)}

/* ============ 导入弹窗 ============ */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(29,42,51,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.modal.show{opacity:1;pointer-events:auto}
.modal-box{background:var(--surface);width:720px;max-width:94vw;max-height:90vh;display:flex;flex-direction:column;
  border-radius:10px;box-shadow:var(--shadow);transform:translateY(10px);transition:transform .2s}
.modal.show .modal-box{transform:translateY(0)}
.modal-head{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:17px;color:var(--ink)}
.modal-head .x{background:none;border:none;font-size:22px;color:var(--text3);line-height:1}
.modal-body{padding:20px 22px;overflow-y:auto}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px}
.field select{height:36px;border:1px solid var(--line);border-radius:5px;padding:0 10px;width:100%;outline:none}
.field textarea{width:100%;height:170px;border:1px solid var(--line);border-radius:6px;padding:11px 12px;
  resize:vertical;outline:none;line-height:1.6;font-size:13px}
.field textarea:focus{border-color:var(--amber2)}
.hint{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.5}
.link-btn{background:none;border:none;color:var(--pending);font-size:12px;padding:0;text-decoration:underline}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;align-items:center}
.btn-ghost{height:36px;border:1px solid var(--line);background:#fff;color:var(--text2);border-radius:6px;padding:0 16px;font-size:13px}
.btn-ghost:hover{border-color:var(--text3)}
.parse-result{border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:6px}
.pr-head{background:#f7f8f9;padding:9px 13px;font-size:12px;font-weight:700;color:var(--text2);border-bottom:1px solid var(--line)}
.pr-body{padding:13px}
.pr-facts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.pr-edit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr-edit .full{grid-column:1/-1}
.pr-edit input,.pr-edit select{height:34px;border:1px solid var(--line);border-radius:5px;padding:0 9px;width:100%;outline:none;font-size:13px}
.merge-tip{background:var(--amberSoft);border:1px solid #ecd9a8;border-radius:6px;padding:9px 12px;font-size:12px;color:#8a6412;margin-bottom:11px}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);
  color:#fff;padding:11px 20px;border-radius:7px;font-size:13px;z-index:200;opacity:0;pointer-events:none;
  transition:.25s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--amber2)}

/* ============ 响应式：平板 ============ */
@media(max-width:1100px){
  .queues{grid-template-columns:repeat(3,1fr)}
  .top-search{max-width:300px}
}
.fi{display:flex;align-items:center;gap:6px}
.filter-toggle{display:none;align-items:center;gap:5px;height:32px;border:1px solid var(--line);
  background:#fff;color:var(--text2);border-radius:5px;padding:0 11px;font-size:12px;font-weight:600}
.filter-toggle i{width:6px;height:6px;border-radius:50%;background:#c3cbd0;font-style:normal}

/* ============ 响应式：手机 ============ */
@media(max-width:767px){
  .topbar{height:auto;min-height:56px;padding:9px 13px;gap:9px;flex-wrap:wrap}
  .brand{min-width:0;flex:1}
  .brand-mark{width:30px;height:30px;font-size:14px}
  .brand h1{font-size:14px}
  .brand .sub{display:none}
  .top-search{order:9;flex:0 0 100%;max-width:none}
  .top-search input{height:34px}
  .top-actions{margin-left:0;gap:7px}
  .remind{font-size:0;padding:4px 8px;gap:0;border-radius:14px}
  .remind b{font-size:11px;line-height:16px}
  .btn-primary{height:32px;padding:0 11px;font-size:12px}

  .queues{grid-template-columns:repeat(2,1fr);gap:9px;padding:11px 13px 2px}
  .queue{padding:11px 12px}
  .queue:last-child{grid-column:span 2}
  .q-num{font-size:26px}
  .q-name{font-size:12px}
  .q-icon{width:22px;height:22px;font-size:12px}
  .q-foot{font-size:10px}

  .toolbar{margin:10px 13px 0;padding:9px 10px;gap:8px}
  .filter-sep{display:none}
  .filter-toggle{display:inline-flex}
  .filters{display:none;order:9;flex:0 0 100%;border-top:1px solid var(--lineSoft);padding-top:10px;gap:9px}
  .filters.open{display:flex}
  .filters .fi{flex:0 0 calc(50% - 5px);flex-direction:column;align-items:stretch;gap:3px}
  .filters .fi label{font-size:11px}
  .filters .fi select{width:100%;max-width:none;flex:none;height:32px}
  .btn-clear{flex:0 0 100%}
  .result-count{margin-left:auto;font-size:11px}
  .viewtabs button{padding:5px 11px;font-size:12px}
  .content{padding:12px 13px 30px}

  /* 表格转卡片 */
  .table-wrap{border:none;background:transparent;overflow:visible}
  table.tickets{display:block;min-width:0}
  table.tickets thead{display:none}
  table.tickets tbody{display:block}
  table.tickets tbody tr{display:block;background:#fff;border:1px solid var(--line);
    border-radius:8px;margin-bottom:10px;padding:12px 14px}
  table.tickets td{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    padding:5px 0;border:none;text-align:right;font-size:12px}
  table.tickets td::before{content:attr(data-label);color:var(--text3);font-size:11px;
    font-weight:600;flex-shrink:0;text-align:left;padding-top:2px}
  table.tickets td:nth-child(2){display:block;text-align:left;padding:0 0 9px;
    border-bottom:1px dashed var(--lineSoft);margin-bottom:6px}
  table.tickets td:nth-child(2)::before{display:none}
  .ttitle{max-width:none!important;font-size:14px}
  .ttitle .flags{margin-top:6px}
  .empty{background:#fff;border:1px solid var(--line);border-radius:8px}

  .summary-grid{grid-template-columns:1fr}
  .drawer{width:100%;max-width:100%}
  .dr-head{padding:14px 16px}
  .dr-head h2{font-size:16px}
  .dr-close{right:12px;top:12px}
  .dr-tabs{padding:0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .dr-tabs button{padding:11px 10px;font-size:12px;white-space:nowrap}
  .dr-body{padding:14px 16px 30px}
  .info-grid{grid-template-columns:1fr}
  .modal-box{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0}
  .modal-head{padding:14px 16px}
  .modal-body{padding:14px 16px}
  .modal-foot{padding:12px 16px;gap:8px}
  .modal-foot .btn-primary,.modal-foot .btn-ghost{flex:1;justify-content:center;padding:0 8px}
  .field textarea{height:150px}
  .pr-edit{grid-template-columns:1fr}
  .toast{width:calc(100% - 40px);text-align:center}
}
@media(max-width:380px){
  .queues{gap:7px;padding:9px 10px 2px}
  .queue{padding:10px}
  .q-num{font-size:23px}

/* 状态由 offset 推导；verify 显式保留 */
function effectiveStatus(t){return t.status;}
function dueDate(t){return fullDate(t.dueOffset);}
function dueLabel(t){
  if(t.status==='done') return '已完成';
  const n=t.dueOffset;
  if(n<0) return '逾期 '+(-n)+' 天 · '+dueDate(t);
  if(n===0) return '今天到期 · '+dueDate(t);
  return '还剩 '+n+' 天 · '+dueDate(t);
}

let state={view:'list',status:'',assignee:'',group:'',customer:'',vehicle:'',order:'',q:'',openId:null,draft:null};

/* ==================== 渲染：队列 ==================== */
function renderQueues(){
  const counts={};QORDER.forEach(s=>counts[s]=tickets.filter(t=>effectiveStatus(t)===s).length);
  const foot={pending:'尚未认领/处理',due:'今日或近日到期',overdue:'已超过跟进时间',verify:'信息未经确认',done:'已归档关闭'};
  $('#queues').innerHTML=QORDER.map(s=>{
    const st=STATUS[s];
    return `<div class="queue ${state.status===s?'active':''}" data-q="${s}" style="--qc:${st.color};--qbg:${st.bg}">
      <div class="q-top"><span class="q-name">${st.label}</span><span class="q-icon">${st.icon}</span></div>
      <div class="q-num">${counts[s]}<small>条</small></div>
      <div class="q-foot">${foot[s]}</div></div>`;
  }).join('');
}

/* ==================== 渲染：筛选 ==================== */
function uniq(key){return [...new Set(tickets.map(t=>t[key]).filter(Boolean))];}
function renderFilterOptions(){
  const map={assignee:ASSIGNEES,group:GROUPS,customer:CUSTOMERS,vehicle:VEHICLES,order:ORDERS};
  Object.keys(map).forEach(k=>{
    const el=$(`select[data-filter="${k}"]`);
    if(!el) return;
    const opts=uniq(k);
    el.innerHTML='<option value="">全部</option>'+opts.map(v=>`<option value="${ATTR(v)}">${esc(v)}</option>`).join('');
  });
  $('select[data-filter="status"]').innerHTML='<option value="">全部</option>'+QORDER.map(s=>`<option value="${s}">${STATUS[s].label}</option>`).join('');
}
function syncFilters(){
  Object.keys(state).forEach(k=>{if(['assignee','group','customer','vehicle','order','status'].includes(k)){
    const el=$(`select[data-filter="${k}"]`);if(el)el.value=state[k];}});
}

/* ==================== 过滤 ==================== */
function filtered(){
  const q=state.q.trim().toLowerCase();
  return tickets.filter(t=>{
    if(state.status && effectiveStatus(t)!==state.status) return false;
    for(const k of ['assignee','group','customer','vehicle','order']){if(state[k] && t[k]!==state[k])return false;}
    if(q){const hay=[t.id,t.title,t.assignee,t.group,t.customer,t.vehicle,t.order,...t.evidence].join(' ').toLowerCase();
      if(!hay.includes(q))return false;}
    return true;
  });
}

function renderDrawer(){

      <span class="chip">版本 v${t.version}</span>
      <span class="chip">当前状态以工单记录为准</span></div>`;

function bindDrawerActions(t){
  const add=()=>{
    const inp=$('#followInput');if(!inp||!inp.value.trim())return;

    t.version+=1;
    t.history.push(ver(t.version,nowStamp(),'添加跟进记录',{status:t.status,assignee:t.assignee,title:t.title}));
    save();renderAll();renderDrawer();toast('跟进记录已写入时间线');
  };
  const btn=$('#addFollowBtn');if(btn)btn.onclick=add;
  const inp=$('#followInput');if(inp)inp.onkeydown=e=>{if(e.key==='Enter')add();};
}

/* ==================== 导入解析 ==================== */
const SAMPLE=`王铁锤 09:32 @李伟 和记火锅那单液蜡，客户说还没到，查下车豫A·8F621的位置，订单DD20261116001
李伟 09:35 我查一下轨迹，这个要核实
张敏 09:41 @王铁锤 客户刚打电话又催了，说再不到就投诉，今天必须处理`;
function parseMessages(text){
  return text.split(/\n+/).map(s=>s.trim()).filter(Boolean).map(line=>{
    let m=line.match(/^([^\s:：\[\]]{1,12})\s+(\d{1,2}:\d{2})\s*[：:]?\s*(.*)$/);
    if(m)return {sender:m[1],time:m[2],content:m[3]};
    m=line.match(/^(\d{1,2}:\d{2})\s+([^\s:：]{1,12})\s*[：:]\s*(.*)$/);
    if(m)return {sender:m[2],time:m[1],content:m[3]};
    return {sender:'未知',time:'--:--',content:line};
  });
}
function extractFacts(msgs){
  const all=msgs.map(m=>m.content).join(' ');
  const plate=(all.match(/[京沪粤豫鲁冀苏浙皖鄂湘川渝][A-Z]·?[A-Z0-9]{5,6}/)||[])[0]||'';
  const order=(all.match(/(?:订单|单号|DD)[号]?[:：\s#]*([A-Za-z0-9]{8,})/)||[])[1]||'';
  const mentions=[...all.matchAll(/@([\u4e00-\u9fa5A-Za-z0-9_]{2,10})/g)].map(x=>x[1]);
  const verify=/核实|确认|查一下|轨迹|定位|待查|质量|核价/.test(all);
  const urgent=/逾期|超时|今天必须|赶紧|急|投诉|再不到/.test(all);
  const conflict=/不一致|说法|投诉|没收到|说.*但/.test(all);
  const customer=(all.match(/([\u4e00-\u9fa5]{2,8}(?:酒店|火锅|粮油|食堂|商贸|饭庄))/)||[])[1]||'';
  const title=(msgs.find(m=>m.content.length>12)?.content||msgs[0]?.content||'新事项').slice(0,32);
  return {plate,order,mentions,verify,urgent,conflict,customer,title};
}
function parseChat(){

  if(!text){toast('请先粘贴聊天内容');return;}
  const group=$('#impGroup').value||GROUPS[0];

  const match=tickets.find(t=>(f.order&&t.order===f.order)||(f.plate&&t.vehicle===f.plate)||(f.customer&&t.customer===f.customer));
  const suggestedStatus=f.verify?'verify':(f.urgent?'overdue':'pending');
  state.draft={group,msgs,f,match,suggestedStatus};
  $('#parseArea').innerHTML=`<div class="parse-result">
    <div class="pr-head">解析结果 · ${msgs.length} 条消息 · <span style="color:${match?'var(--overdue)':'var(--done)'}">${match?'发现可合并工单':'新事项'}</span></div>
    <div class="pr-body">
      ${match?`<div class="merge-tip">检测到与现有工单 <b>${match.id}</b>（${esc(match.title)}）关联，可合并：追加原始消息、时间线并保留历史版本。</div>`:''}
      <div class="pr-facts">
        ${f.plate?`<span class="chip plate">${esc(f.plate)}</span>`:''}
        ${f.order?`<span class="chip evi">订单 ${esc(f.order)}</span>`:''}
        ${f.customer?`<span class="chip">${esc(f.customer)}</span>`:''}
        ${f.mentions.length?`<span class="chip">@${f.mentions.map(esc).join(' @')}</span>`:''}
        ${f.verify?'<span class="chip verify">含待核实信息</span>':''}
        ${f.conflict?'<span class="chip conflict">疑似矛盾</span>':''}
      </div>
      <div class="pr-edit">
        <div class="full"><label class="hint">事项标题</label><input id="dTitle" value="${ATTR(f.title)}"></div>
        <div><label class="hint">责任人</label><input id="dAssignee" value="${ATTR(f.mentions[0]||'')}" placeholder="姓名"></div>
        <div><label class="hint">状态</label><select id="dStatus">${QORDER.map(s=>`<option value="${s}" ${s===suggestedStatus?'selected':''}>${STATUS[s].label}</option>`).join('')}</select></div>
        <div><label class="hint">客户</label><input id="dCustomer" value="${ATTR(f.customer)}"></div>
        <div><label class="hint">车辆</label><input id="dVehicle" value="${ATTR(f.plate)}"></div>
      </div>

}
function confirmAdd(){
  const d=state.draft;if(!d)return;

    t.raw.push(...d.msgs.map(m=>msg(d.group,m.sender,'今天 '+m.time,m.content)));
    t.timeline.push(tl(nowStamp(),'消息','合并新群聊消息：'+title.slice(0,20)));

    t.history.push(ver(t.version,nowStamp(),'合并群聊消息并修订',{status:t.status,assignee:t.assignee,title:t.title}));
    if(d.f.conflict&&!t.contradictions.length)t.contradictions.push('新合并消息中出现说法不一致，待核实');
    if(d.f.verify)t.needsVerify=true;

    state.openId=t.id;

      evidence:d.f.order?['证-'+fullDate(0)+'-NEW']:[],
      contradictions:d.f.conflict?['群聊消息中存在说法不一致，待核实']:[],
      crossGroup:false,needsVerify:d.f.verify,priority:d.f.urgent?'高':'中',version:1,
      raw:d.msgs.map(m=>msg(d.group,m.sender,'今天 '+m.time,m.content)),

let AUTH_TOKEN = sessionStorage.getItem('logi_token') || '';
let CURRENT_USER = null;
let saveTimer = null;
// 分享网关要求每个请求带 sharecode；从当前地址提取并附加
const SHARE_CODE = (()=>{const m=location.search.match(/[?&]sharecode=([^&]+)/);return m?m[1]:''})();
function apiUrl(path){
  let u='/api'+path;
  const extra=[];
  if(SHARE_CODE) extra.push('sharecode='+encodeURIComponent(SHARE_CODE));
  if(AUTH_TOKEN) extra.push('token='+encodeURIComponent(AUTH_TOKEN));
  if(extra.length) u+=(path.includes('?')?'&':'?')+extra.join('&');
  return u;
}
async function api(path, opts={}){
  const r = await fetch(apiUrl(path), {
    method:opts.method||'GET',
    headers:{'Content-Type':'application/json', ...(AUTH_TOKEN?{'Authorization':'Bearer '+AUTH_TOKEN}:{})},
    body:opts.body?JSON.stringify(opts.body):undefined
  });
  let data={};try{data=await r.json();}catch(e){}
  if(r.status===401){ logout(); throw new Error(data.error||'登录已过期'); }
  if(!r.ok) throw new Error(data.error||('请求失败 '+r.status));
  return data;
}
function save(){
  // 防抖：整体同步到后端（保留 localStorage 作为离线兜底）
  try{localStorage.setItem('logi_tickets_v1',JSON.stringify(tickets));}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ api('/tickets/sync',{method:'POST',body:{tickets}}).catch(e=>console.warn('sync failed',e.message)); },300);
}
async function load(){
  try{
    const d=await api('/tickets');
    tickets=d.tickets||[];
  }catch(e){
    // 离线兜底
    try{const s=localStorage.getItem('logi_tickets_v1');if(s&&JSON.parse(s).length){tickets=JSON.parse(s);return;}}catch(_){}
    tickets=[];
  }
}
function resetData(){localStorage.removeItem('logi_tickets_v1');seedData();save();renderAll();toast('示例数据已重置');}
async function logout(){
  try{await api('/logout',{method:'POST'});}catch(e){}
  AUTH_TOKEN='';CURRENT_USER=null;sessionStorage.removeItem('logi_token');
  $('#loginMask').classList.remove('hide');
}

function toast(html){const el=$('#toast');el.innerHTML=html;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}
function renderAll(){renderQueues();renderList();renderSummary();updateRemind();
  const on=['assignee','group','customer','vehicle','order','status'].some(k=>!!state[k]);
  const dot=$('.filter-toggle i');if(dot)dot.style.background=on?'var(--amber)':'#c3cbd0';}
function updateRemind(){
  const n=tickets.filter(t=>t.status!=='done'&&t.dueOffset<=0).length;
  $('#remindCount').textContent=n;
}

/* ==================== 启动 ==================== */
bind();
(async function(){
  const ok=await restoreSession();
  if(ok){ $('#loginMask').classList.add('hide'); await load(); renderFilterOptions(); syncFilters(); renderAll(); }
  else { renderQueues(); renderList(); renderSummary(); }
})();
</script>
</body>
</html>
